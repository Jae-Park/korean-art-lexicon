# 기관 통째 스크랩(institutional bulk scrape) 진행 트래커 — 정본.
# 각 기관이 파이프라인 어느 단계인지 + 카운트를 기록. 반복 작업의 단일 출처.
#
# 단계(stage): planned → recon → scraper → crawled → pushed → reviewing → harvested → published → live
#   planned    수집 대상 후보(미착수)
#   recon      사이트 구조 역설계 완료(스크랩 방법 확정)
#   scraper    스크레이퍼/피더 빌드 완료
#   crawled    데이터 추출 완료(records 확보)
#   pushed     후보를 노션 검수 DB에 push
#   reviewing  사람 검수 중(노션)
#   harvested  승인분 materialize→PR
#   published  data/에 반영(라이브 사이트)
#   live       정기 자동 피더로 상시 가동(MMCA 등)
#
# counts: crawled=추출 레코드수, candidates=매핑된 후보, pushed=노션 행, approved=승인, published=data/ 반영
# (published는 scripts/institution_status.py가 dist/lexicon.json에서 도메인 매칭으로 라이브 재계산)

institutions:
  - key: mmca
    name_ko: 국립현대미술관
    name_en: MMCA
    domain: mmca.go.kr
    scraper: miner/src/feeders/mmca.js
    tech: "Ajax JSON API(AjaxExhibitionList.do?pageIndex=N) — JS렌더 우회, 결정론 $0. ※currentPageNo는 서버가 무시(첫장 반복 버그) → pageIndex가 실제 페이징 param."
    stage: pushed
    coverage: "전시·작가 (전체 162p/1293전시, 1999~현재). institution=국립현대미술관 태깅."
    counts: { crawled: 1293, candidates: 5157, pushed: 5157, approved: null }
    updated: 2026-06-22
    notes: "pageIndex 버그픽스 후 전체 재크롤 — 과거 currentPageNo 버그로 첫 8전시·47행만 들어갔던 것을 교체. 5157 new(1270전시+3887작가, 이상범~노순택 통사) 적재. exhArtist 한글만이라 로마자 없음 → 퍼블리시 시 별도 로마자 소스 필요."
    crawl:
      last_run: 2026-06-22
      record_count: 1293
      extent: "AjaxExhibitionList.do pageIndex 1~162, 전시 1293건"
      mode: "live API 재크롤. 증분 미구현(전체 재크롤)."

  - key: altpool
    name_ko: 아트스페이스 풀
    name_en: Art Space Pool
    domain: altpool.org
    scraper: miner/src/feeders/altpool.js (codex 추출본 기반)
    tech: "board_id+b_type 게시판. 전체 미러(1790HTML/11btype) → codex LLM 의미추출(regex 폐기, 비일관 itemTitle 흡수). 영문판 매칭 로마자."
    stage: reviewing
    coverage: "전시 242·작가 690·기관 1 = 933 (1999~2020). 풀에 911행."
    counts: { crawled: 244, candidates: 933, pushed: 911, approved: null }
    updated: 2026-06-13
    notes: "codex 의미추출이 피더 단일소스. 영문명 ~2010 개칭(Wayback 154/246 스냅샷). 검수 대기. ※이전 institutions.yaml에서 MMCA 항목에 잘못 병합돼 있던 것 분리(2026-06-22)."
    crawl:
      last_run: 2026-06-13
      record_count: 244
      extent: "b_type=8 전체, board_id 303–2206, 전시 244건, 1999–2020"
      high_water: { max_board_id: 2206, b_types: [8] }  # 다음 크롤: board_id > 2206만(증분)
      sha256_16: 7abcb1b83238c50b
      local_archive: crawl-archive/altpool/altpool_20260613.json
      en_romanization: crawl-archive/altpool/en_romanization_20260613.json
      wayback_index: crawl-archive/altpool/wayback_20260613.json
      full_mirror: crawl-archive/altpool/mirror/  # 1790파일/16MB/11 b_type — 영구 로컬본
      codex_extract: crawl-archive/altpool/codex_extract.json  # 피더 단일소스(최종)
      mirror_extract: crawl-archive/altpool/extract_from_mirror.json  # regex(폐기, 비교용)

  - key: neolook
    name_ko: 네오룩
    name_en: neolook
    domain: neolook.com
    scraper: miner/crawl/neolook_harvest.py (+ src/feeders/neolook.js)
    tech: "Phoenix LiveView — self-serve 전수수확 불가(전수검증): 디테일/연도/날짜 라우트 전부 0B octet-stream 다운로드, 페이지네이션 웹소켓 전용, robots Disallow /archives/. 서버렌더되는 /archives 보드(현재+예정 ~101)만 Playwright로 수확."
    stage: pushed
    coverage: "전시·작가·장소 (forward-only 보드 데일리 스킴)"
    schedule: "매일 05:10 KST — com.lexicon.neolook (run-neolook.sh). 로컬 미러만, 노션 미접촉(push는 수동·human-gate)."
    counts: { crawled: 85, candidates: 209, pushed: 209, approved: 0 }  # 209 적재 2026-06-21
    updated: 2026-06-21
    notes: "운영자(사장) 구두 OK. export는 팀 운영 미비(전시게재 요청폼이 hwp)로 포기 → forward 보드 누적 전략. 개인전 '작가展'→작가+한자 추출, 공모·잡지 필터, 이름꼴 가드. 과거 백필(2000~2016) 자력 불가. press 출처라 verified=false/medium → 교차등장 시만 weight 상승."
    crawl:
      last_run: 2026-06-21
      record_count: 85
      extent: "보드 101카드 → 85전시(개인전 50/단체 35)+공모11+잡지5"
      mode: "forward-daily-skim (id 단위 증분 dedup, 누적)"
      local_archive: miner/data-mirror/neolook/board.jsonl  # gitignore(로컬 캐시, harvested_at 타임스탬프)

