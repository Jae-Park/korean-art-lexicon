# 기관 통째 스크랩(institutional bulk scrape) 진행 트래커 — 정본.
# 각 기관이 파이프라인 어느 단계인지 + 카운트를 기록. 반복 작업의 단일 출처.
#
# 단계(stage): planned → recon → scraper → crawled → pushed → reviewing → harvested → published → live
#   planned    수집 대상 후보(미착수)
#   recon      사이트 구조 역설계 완료(스크랩 방법 확정)
#   scraper    스크레이퍼/피더 빌드 완료
#   crawled    데이터 추출 완료(records 확보)
#   pushed     후보를 노션 검수 DB에 push
#   reviewing  사람 검수 중(노션)
#   harvested  승인분 materialize→PR
#   published  data/에 반영(라이브 사이트)
#   live       정기 자동 피더로 상시 가동(MMCA 등)
#
# counts: crawled=추출 레코드수, candidates=매핑된 후보, pushed=노션 행, approved=승인, published=data/ 반영
# (published는 scripts/institution_status.py가 dist/lexicon.json에서 도메인 매칭으로 라이브 재계산)

institutions:
  - key: mmca
    name_ko: 국립현대미술관
    name_en: MMCA
    domain: mmca.go.kr
    scraper: miner/src/feeders/mmca.js
    tech: "Ajax JSON API(AjaxExhibitionList.do) — JS렌더 우회, 결정론 $0"
    stage: live
    coverage: "전시(정기 월/목 크롤)"
    counts: { crawled: null, candidates: null, pushed: null, approved: null }
    updated: 2026-06-11
    notes: "미러(1790HTML/11btype)를 codex LLM 의미추출 → 전시 242(EN 150)·작가 690(로마자 414)·기관 1 = 933 노션 push. 비일관 itemTitle을 codex가 흡수(regex 폐기). 영문명 ~2010 개칭(Wayback 154/246 스냅샷). 검수 대기."
    # 크롤 체크포인트 — 언제/어디까지/어디 저장. 재크롤 시 증분 기준.
    crawl:
      last_run: 2026-06-13
      record_count: 244
      extent: "b_type=8 전체, board_id 303–2206, 전시 244건, 1999–2020"
      high_water: { max_board_id: 2206, b_types: [8] }  # 다음 크롤: board_id > 2206만(증분)
      local_archive: crawl-archive/altpool/altpool_20260613.json
      sha256_16: 7abcb1b83238c50b
      en_romanization: crawl-archive/altpool/en_romanization_20260613.json  # 영문판 매칭 로마자/제목 맵
      wayback_index: crawl-archive/altpool/wayback_20260613.json  # 라이브URL↔스냅샷 매핑
      full_mirror: crawl-archive/altpool/mirror/  # 전체 사이트 원본 HTML(1790파일/16MB/11 b_type) — 영구 로컬본
      codex_extract: crawl-archive/altpool/codex_extract.json  # codex LLM 의미추출(피더 단일소스, 최종)
      mirror_extract: crawl-archive/altpool/extract_from_mirror.json  # regex 추출(폐기, 비교용)

  - key: artsonje
    name_ko: 아트선재센터
    name_en: Art Sonje Center
    domain: artsonje.org
    stage: planned
    coverage: "전시·작가"
    updated: 2026-06-13
    notes: "다음 후보."

  - key: kukje
    name_ko: 국제갤러리
    name_en: Kukje Gallery
    domain: kukjegallery.com
    stage: planned
    updated: 2026-06-13

  - key: gwangju-biennale
    name_ko: 광주비엔날레
    name_en: Gwangju Biennale
