category:
  aat: '300055769'
definition:
  ko: 1960년대 후반에서 1970년대 한국에서 전개된 전위적 미술 경향. 해프닝, 행위, 개념미술, 대지미술, 오브제 등 기존 매체와 제도를 벗어난 실험적 실천을 포괄한다.
  en: An avant-garde art tendency that developed in Korea from the late 1960s through
    the 1970s, encompassing experimental practices beyond conventional media and
    institutions, including happenings, performance, conceptual art, land art, and
    object-based work.
period:
  start: 1967
