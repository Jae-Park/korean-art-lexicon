notes: 국립현대미술관·구겐하임 공동기획 순회전(서울 2023 → 구겐하임 뉴욕 2023-24 → 해머미술관 LA 2024). 한국 실험미술을 다룬 첫 북미 미술관 전시. 참여작가는 어휘집 등재분 4명만 연결(실제 약 29명).
