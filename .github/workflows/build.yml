name: Build Check

# Verifies the lexicon builds cleanly. Does NOT commit dist (it is generated at
# deploy time by deploy.yml and gitignored), so there is no commit-back to main.

on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**']
  pull_request:
    branches: [main]
    paths: ['data/**', 'scripts/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
